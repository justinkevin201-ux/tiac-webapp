// បង្ហាញរូបតំណាងពីតារាង ICONS
function Icon({ name, size = 16, className = "" }) {
  return (

      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

}

// រក្សាទុកទិន្នន័យ: localStorage (ជានិច្ច) + Supabase តារាង app_state (បើកំណត់ហើយ)
// សិទ្ធិសរសេរត្រូវបានគ្រប់គ្រងដោយច្បាប់ RLS ក្នុង Database មិនមែនក្នុងកូដនេះទេ
function usePersist(key, initial) {
  const [v, setV] = useState(() => { try { return JSON.parse(localStorage.getItem(key)) ?? initial; } catch { return initial; } });
  const loaded = useRef(!sb);       // Cloud: រង់ចាំអានពី Database រួចសិន មុនសរសេរ
  const fromCloud = useRef(false);  // ទើបទាញពី Cloud → កុំសរសេរត្រឡប់ទៅវិញ

  // អានពី Cloud ពេលបើក និងពេល Login/Logout (សិទ្ធិអានប្តូរ)
  useEffect(() => {
    if (!sb) return;
    const load = () => sb.from("app_state").select("value").eq("key", key).maybeSingle().then(({ data }) => {
      if (data) { fromCloud.current = true; setV(data.value); }
      loaded.current = true;
    });
    load();
    // ប្រុងប្រយ័ត្ន: កុំឲ្យ callback នេះ return Promise ឬហៅ Supabase ផ្ទាល់ ព្រោះបណ្តាលឲ្យ session គាំង (deadlock)
    // ប្រើ setTimeout ដើម្បីហៅបន្ទាប់ពី callback ចប់ ហើយអានតែពេល Login/Logout
    const { data: { subscription } } = sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(load, 0);
    });
    return () => subscription.unsubscribe();
  }, [key]);

  // សរសេរពេលទិន្នន័យប្តូរ
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
    if (!sb || !loaded.current) return;
    if (fromCloud.current) { fromCloud.current = false; return; }
    sb.from("app_state").upsert({ key, value: v, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) console.warn("Cloud save blocked:", error.message); });
  }, [key, v]);
  return [v, setV];
}

// រក្សាទុក File ដែលបាន Upload ក្នុង IndexedDB (ឥតគិតថ្លៃ, ទុកក្នុង Browser)
const openDB = () => new Promise((ok, no) => {
  const r = indexedDB.open("tia-files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("files");
  r.onsuccess = () => ok(r.result); r.onerror = no;
});
const idbSave = async (id, file) => (await openDB()).transaction("files", "readwrite").objectStore("files").put(file, id);
const idbGet = async (id) => { const db = await openDB(); return new Promise((ok) => { const q = db.transaction("files").objectStore("files").get(id); q.onsuccess = () => ok(q.result); }); };
// ទុក/ទាញ File: Cloud Mode ប្រើ Supabase Storage (bucket "files"), Demo Mode ប្រើ IndexedDB
const fileSave = async (id, file) => (sb ? sb.storage.from("files").upload(id, file, { upsert: true, contentType: file.type || undefined }) : idbSave(id, file));
const fileGet = async (id) => { if (!sb) return idbGet(id); const { data } = await sb.storage.from("files").download(id); return data; };
const guessFormat = (name) => {            // ទាយ Format ពីកន្ទុយឈ្មោះ File
  const ext = name.split(".").pop().toLowerCase();
  if (ext === "pdf") return "PDF";
  if (["xls", "xlsx", "csv"].includes(ext)) return "EXCEL";
  if (["doc", "docx"].includes(ext)) return "WORD";
  if (["dwg", "dxf"].includes(ext)) return "CAD";
  if (["jpg", "jpeg", "png", "gif", "webp", "heic"].includes(ext)) return "PHOTO";
  if (["zip", "rar", "7z"].includes(ext)) return "ZIP";
  return "OTHER";
};

// កាត់រូបស្វ័យប្រវត្តិទៅ 16:9 (800x450) ពីកណ្តាលរូប
function cropImage(file, w = 800, h = 450) {
  return new Promise((ok) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const k = Math.max(w / img.width, h / img.height), sw = w / k, sh = h / k;
      c.getContext("2d").drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = URL.createObjectURL(file);
  });
}

// អាកាសធាតុ: Open-Meteo (ឥតគិតថ្លៃ, គ្មាន API key) តាមទីតាំងគម្រោង
const WX = (c) => (c === 0 ? "☀️" : c < 3 ? "⛅" : c < 50 ? "☁️" : c < 70 ? "🌧️" : c < 80 ? "🌦️" : "⛈️");
function WeatherWidget({ t, isKm }) {
  const [w, setW] = useState(null);
  useEffect(() => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}`
      + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code"
      + "&hourly=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FPhnom_Penh&forecast_days=6";
    fetch(url).then((r) => r.json()).then(setW).catch(() => setW({ error: true }));
  }, []);
  const c = w && w.current;
  const h0 = c ? w.hourly.time.findIndex((x) => x.slice(0, 13) >= c.time.slice(0, 13)) : 0;
  return (
    <div className="p-3 rounded-md border border-inherit bg-blue-50/50 dark:bg-blue-950/20 text-xs space-y-2">
      <div className="font-bold text-blue-700 dark:text-blue-300">{t.projectLocation}</div>
      {!w && <div>Loading…</div>}
      {w && w.error && <div>Weather unavailable (check internet).</div>}
      {c && (<>
        <div className="flex items-center gap-3">
          <span className="text-4xl">{WX(c.weather_code)}</span>
          <div><div className="text-2xl font-black">{c.temperature_2m}°C</div>
            <div className="text-[11px]">💧 Moisture {c.relative_humidity_2m}% · 💨 Wind {c.wind_speed_10m} km/h</div></div>
        </div>
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          {w.hourly.time.slice(h0, h0 + 12).map((tm, k) => (
            <div key={tm} className="min-w-[56px] p-1 rounded bg-slate-100 dark:bg-slate-900 text-center text-[10px] font-mono">
              <div className="text-slate-500">{tm.slice(11, 16)}</div><div>{WX(w.hourly.weather_code[h0 + k])}</div>
              <div className="font-bold">{Math.round(w.hourly.temperature_2m[h0 + k])}°</div>
              <div>💧{w.hourly.relative_humidity_2m[h0 + k]}%</div><div>💨{Math.round(w.hourly.wind_speed_10m[h0 + k])}</div>
            </div>
          ))}
        </div>
        <div className="space-y-1 font-mono text-[11px]">
          {w.daily.time.slice(1).map((d, k) => (
            <div key={d} className="flex justify-between"><span className="w-24">{new Date(d).toLocaleDateString(isKm ? "km-KH" : "en-GB", { weekday: "short", day: "numeric", month: "short" })}</span>
              <span>{WX(w.daily.weather_code[k + 1])}</span><b>{Math.round(w.daily.temperature_2m_max[k + 1])}° / {Math.round(w.daily.temperature_2m_min[k + 1])}°</b></div>
          ))}
        </div>
      </>)}
    </div>
  );
}

  );

// កម្មវិធីបញ្ចាំងរូបថត Drone (ប្តូររូបស្វ័យប្រវត្តិរៀងរាល់ ៤ វិនាទី) + ប៊ូតុង Upload រូប 10
function DroneGallery({ images, title, onUpload, uploadLabel }) {
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(true);
  useEffect(() => {
    if (!playing || images.length < 2) return;
    const timer = setInterval(() => setIndex((i) => (i + 1) % images.length), 4000);
    return () => clearInterval(timer);
  }, [playing, images.length]);
  const current = images[index % Math.max(1, images.length)];
  const btn = "p-1 rounded border border-inherit hover:bg-slate-200 dark:hover:bg-slate-800";
  return (
    <div>
      <CardTitle icon="Image" right={
        <div className="flex items-center gap-1">
          {onUpload && (
            <label className="px-2 py-0.5 rounded bg-emerald-600 text-white text-[10px] font-bold cursor-pointer">
              {uploadLabel}<input type="file" accept="image/*" multiple hidden onChange={onUpload} />
            </label>
          )}
          <button className={btn} onClick={() => setIndex((i) => (i - 1 + images.length) % images.length)}><Icon name="ChevronLeft" size={14} /></button>
          <button className={btn} onClick={() => setIndex((i) => (i + 1) % images.length)}><Icon name="ChevronRight" size={14} /></button>
          <button className={btn} onClick={() => setPlaying(!playing)}><Icon name={playing ? "Pause" : "Play"} size={14} /></button>
        </div>
      }>{title}</CardTitle>
      {current ? (
        <div className="relative rounded-md overflow-hidden aspect-video border border-inherit">
          <img src={current.url} alt="Drone view" className="w-full h-full object-cover" />
          <div className="absolute bottom-0 inset-x-0 p-2.5 bg-black/80 text-white text-[11px] font-bold flex justify-between">
            <span className="truncate pr-2">{current.caption}</span>
            <span className="font-mono text-blue-300">{index % images.length + 1} / {images.length}</span>
          </div>
        </div>
      ) : <div className="text-xs text-slate-500 py-6 text-center">No photos yet.</div>}
    </div>
  );
}

/* =====================================================================
   ផ្នែកទី ៥៖ App ចម្បង
   ===================================================================== */
function App() {
  /* ---------- ក. State (ទិន្នន័យដែលផ្លាស់ប្តូរបាន) ---------- */
  const [lang, setLang] = useState("en");               // ភាសា: "en" ឬ "km"
  const [theme, setTheme] = useState("light");          // ពន្លឺ: "light" ឬ "dark"
  const [demoRole, setDemoRole] = useState("admin");  // Demo Mode: ប្តូរតួនាទីដោយដៃ
  const [session, setSession] = useState(null);         // Google session (Cloud Mode)
  const [profile, setProfile] = useState(null);         // ជួរក្នុងតារាង profiles: role = pending | staff | admin
  // Cloud Mode: តួនាទីមកពី profiles (មិនទាន់ Login ឬ pending = "viewer" មើលបានតែ Dashboard)
  const role = sb ? (profile?.role === "admin" ? "admin" : profile?.role === "staff" ? "staff" : "viewer") : demoRole;
  const [activeTab, setActiveTab] = useState("dashboard"); // ទំព័រដែលកំពុងបើក
  const [activeSub, setActiveSub] = useState("");       // Sub-Folder ដែលកំពុងជ្រើស
  const [modal, setModal] = useState(null);             // Popup ដែលកំពុងបើក: "login" | "permissions" | "upload" | "editDash" | null
  const [accessDenied, setAccessDenied] = useState(false); // បង្ហាញបដាក្រហម "ហាមឃាត់"

  const [users, setUsers] = useState(sb ? [] : INITIAL_USERS);
  const [currentUser, setCurrentUser] = useState(sb ? GUEST : INITIAL_USERS[0]);
  const [permissions, setPermissions] = usePersist("tia-perm", INITIAL_PERMISSIONS);

  const [documents, setDocuments] = usePersist("tia-docs", initialDocuments);
  const [data, setData] = usePersist("tia-data", { machinery: initialMachineryList, manpower: initialManpowerList, milestones: initialMasterScheduleItems, weekly: initialWeeklyPerfData });
  const [photos, setPhotos] = usePersist("tia-photos", droneImages);  // រូប Drone (អតិបរមា ១០)
  const [editing, setEditing] = useState(null);          // តារាងដែលកំពុងកែ: "machinery" | "manpower" | "milestones" | "weekly" | null
  const [newFile, setNewFile] = useState(null);          // File ដែលបានជ្រើសពី PC
  const [sCurve, setSCurve] = usePersist("tia-scurve", initialSCurveData);
  const [completePct, setCompletePct] = usePersist("tia-pct", 68);   // % ការងារសម្រេចបាន
  const [dates, setDates] = usePersist("tia-dates", { startDate: "2026-05-01", endDate: "2026-12-31" });

  const [filters, setFilters] = useState({ search: "", format: "ALL", status: "ALL", sort: "DATE_DESC" });
  const [newDoc, setNewDoc] = useState(EMPTY_DOC_FORM);  // Form បញ្ចូលឯកសារថ្មី
  const [editForm, setEditForm] = useState(null);        // Form កែប្រែ Dashboard (ចម្លងពេលបើក)

  /* ---------- ខ. តម្លៃដែលគណនាពី State ---------- */
  const t = { ...translations[lang], ...EXTRA[lang] };   // អត្ថបទតាមភាសាបច្ចុប្បន្ន
  const isAdmin = role === "admin";
  const isKm = lang === "km";

  /* ---------- Supabase Auth: Google Login, តួនាទី, បញ្ជីអ្នកប្រើ ---------- */
  // ១) តាមដាន session
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);
  // ២) អាន profile របស់ខ្លួន (role: pending | staff | admin)
  useEffect(() => {
    if (!sb) return;
    if (!session) return setProfile(null);
    const loadProfile = async () => {
      let { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      // បើ profile មិនទាន់មាន (ឧ. Login មុនពេលរត់ SQL) ឲ្យបង្កើតខ្លួនឯងជា pending
      if (!data) {
        const u = session.user, meta = u.user_metadata || {};
        ({ data } = await sb.from("profiles")
          .insert({ id: u.id, email: u.email, name: meta.full_name || u.email, photo: meta.avatar_url || null, role: "pending" })
          .select().maybeSingle());
      }
      setProfile(data);
      // ជូនដំណឹងអ្នកចុះឈ្មោះថ្មី (ម្តងក្នុងមួយ session ដើម្បីកុំរំខាន; ក្រៅពីនេះមានបដាលឿងជានិច្ច)
      if (data && data.role === "pending" && !sessionStorage.getItem("tia-pending-alert")) {
        sessionStorage.setItem("tia-pending-alert", "1");
        alert("សូមអរគុណសម្រាប់ការចុះឈ្មោះ! គណនីរបស់អ្នកស្ថិតក្នុងស្ថានភាពរង់ចាំការអនុម័តពី Admin។ សូមរង់ចាំការផ្ទៀងផ្ទាត់។\n\nThank you for registering! Your account is waiting for Admin approval.");
      }
    };
    loadProfile();
  }, [session]);
  // ៣) បង្ហាញឈ្មោះ/រូបអ្នកប្រើនៅ Sidebar
  useEffect(() => {
    if (!sb) return;
    setCurrentUser(profile
      ? { id: profile.id, name: profile.name || profile.email, email: profile.email, photo: profile.photo || GUEST_PHOTO, status: profile.role === "pending" ? "pending" : "approved" }
      : GUEST);
  }, [profile]);
  // ៤) Admin ទាញបញ្ជីអ្នកប្រើទាំងអស់ (សម្រាប់អនុម័ត)
  useEffect(() => {
    if (!sb || !isAdmin) return;
    sb.from("profiles").select("*").order("created_at").then(({ data }) => setUsers((data || []).map((p) => ({
      id: p.id, name: p.name || p.email, email: p.email, photo: p.photo || GUEST_PHOTO,
      role: p.role === "admin" ? "admin" : "staff", status: p.role === "pending" ? "pending" : "approved",
    }))));
  }, [isAdmin]);

  // Night Mode: ដាក់/ដក class "dark" លើ <html>
  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
  }, [theme]);

  // គណនាចំនួនថ្ងៃ: សរុប / កន្លងផុត / នៅសល់
  const DAY = 1000 * 60 * 60 * 24;
  const start = new Date(dates.startDate);
  const end = new Date(dates.endDate);
  const totalDays = Math.max(1, Math.ceil((end - start) / DAY));
  const daysElapsed = Math.min(totalDays, Math.max(0, Math.ceil((TODAY - start) / DAY)));
  const remainingDays = totalDays - daysElapsed;

  // បុគ្គលិកចូលមើលបានតែផ្នែកដែល Admin បានអនុញ្ញាត (Admin មើលបានទាំងអស់)
  const canAccess = (key) => isAdmin || key === "dashboard" || (role === "staff" && permissions[key]);
  // Admin កែបានទាំងអស់; Staff កែបានតែពេល Admin អនុញ្ញាត (permissions.canEdit); Viewer កែមិនបាន
  const canEditData = isAdmin || (role === "staff" && permissions.canEdit);
  const editBtn = (key) => canEditData && (
    <button onClick={() => setEditing(key)} className="px-2 py-0.5 rounded bg-blue-600 text-white text-[10px] font-bold">{t.edit}</button>
  );
  const currentCategory = categories.find((c) => c.key === activeTab);

  // រាប់ RFI / RFA / SI / NCR ស្វ័យប្រវត្តិពីបញ្ជីឯកសារ
  const countType = (folder, word) =>
    documents.filter((d) => d.subFolder === folder || (d.category === "catRfiNcr" && d.name.includes(word))).length;

  // ចម្រោះឯកសារ: តាមសិទ្ធិ → ប្រភេទ → Sub-Folder → ស្វែងរក → Format → Status → តម្រៀប
  const q = filters.search.toLowerCase();
  const filteredDocs = documents
    .filter((d) => canAccess(d.category))
    .filter((d) => activeTab === "dashboard" || d.category === activeTab)
    .filter((d) => activeTab === "dashboard" || !activeSub || d.subFolder === activeSub)
    .filter((d) => d.name.toLowerCase().includes(q) || d.docNum.toLowerCase().includes(q))
    .filter((d) => filters.format === "ALL" || d.format === filters.format)
    .filter((d) => filters.status === "ALL" || d.status === filters.status)
    .sort(SORTERS[filters.sort]);

  /* ---------- គ. Function សកម្មភាព (ពេលអ្នកប្រើចុចប៊ូតុង) ---------- */

  // បង្ហាញបដា "ហាមឃាត់" ៤ វិនាទី
  const flashAccessDenied = () => {
    setAccessDenied(true);
    setTimeout(() => setAccessDenied(false), 4000);
  };

  // ចុចលើម៉ឺនុយខាងឆ្វេង
  const selectTab = (key) => {
    if (!canAccess(key)) return flashAccessDenied();
    setActiveTab(key);
    const cat = categories.find((c) => c.key === key);
    setActiveSub(cat && cat.subFolders.length > 0 ? cat.subFolders[0] : "");
  };

  // បញ្ចូលឯកសារថ្មី (ដាក់ពីលើគេក្នុងបញ្ជី)
  const uploadDocument = (e) => {
    e.preventDefault();
    if (!newDoc.name.trim() || !newFile) return;
    const cat = categories.find((c) => c.key === newDoc.category);
    const created = {
      id: String(Date.now()),
      docNum: `DOC-${Math.floor(1000 + Math.random() * 9000)}`, // លេខចៃដន្យ ៤ ខ្ទង់
      ...newDoc,
      hubType: cat ? cat.label : "Document",
      date: new Date().toISOString().split("T")[0],
      by: currentUser.name,
      avatar: currentUser.photo,
      views: 1,
      downloads: 0,
      hasFile: true,
    };
    Promise.resolve(fileSave(created.id, newFile)).then((r) => r && r.error && alert("Upload failed: " + r.error.message));   // រក្សាទុក File ពិតក្នុង IndexedDB
    setNewFile(null);
    setDocuments([created, ...documents]);
    setNewDoc(EMPTY_DOC_FORM);
    setModal(null);
  };

  // បើក/ទាញយក File ដែលបាន Upload
  const openDoc = async (doc, download) => {
    const f = doc.hasFile && (await fileGet(doc.id));
    if (!f) return alert("Sample document – no file stored.");
    const url = URL.createObjectURL(f);
    if (download) { const a = document.createElement("a"); a.href = url; a.download = f.name || doc.name; a.click(); } else window.open(url);
  };

  const deleteDocument = (id) => setDocuments(documents.filter((d) => d.id !== id));

  // ចុះឈ្មោះតាម Google (ក្លែងធ្វើ) → ក្លាយជា "pending" រង់ចាំ Admin អនុម័ត
  const simulateGoogleLogin = () => {
    // Cloud Mode: Login ពិតតាម Google (ទំព័រនឹងប្តូរទៅ Google ហើយត្រឡប់មកវិញ)
    if (sb) return sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin + window.location.pathname } });
    const newUser = {
      id: String(Date.now()), name: "New Google User", email: "user.google@gmail.com",
      role: "staff", status: "pending", photo: photo("photo-1535713875002-d1d0cf377fde"),
    };
    setUsers([...users, newUser]);
    setCurrentUser(newUser);
    setDemoRole("viewer");
    setModal(null);
    flashAccessDenied();
  };

  const approveUser = async (id) => {
    // Cloud Mode: ប្តូរ role ក្នុង Database ពី pending → staff (ច្បាប់ RLS អនុញ្ញាតតែ Admin)
    if (sb) { const { error } = await sb.from("profiles").update({ role: "staff" }).eq("id", id); if (error) return alert(error.message); }
    setUsers(users.map((u) => (u.id === id ? { ...u, status: "approved" } : u)));
  };

  // បើក Form កែប្រែ Dashboard (ចម្លងតម្លៃបច្ចុប្បន្នមកកែ)
  const openEditDash = () => {
    setEditForm({ pct: completePct, dates: { ...dates }, sCurve: sCurve.map((d) => ({ ...d })) });
    setModal("editDash");
  };
  const saveEditDash = (e) => {
    e.preventDefault();
    setCompletePct(editForm.pct);
    setDates(editForm.dates);
    setSCurve(editForm.sCurve);
    setModal(null);
  };

  /* ---------- ឃ. ផ្នែកបង្ហាញ (UI) ---------- */

  // ក្រាប S-Curve: បម្លែងទិន្នន័យជាចំណុចក្នុង SVG (ទទឹង 500, កម្ពស់ 180)
  const xOf = (i) => (i * 500) / (sCurve.length - 1);
  const yOf = (value) => 180 - (value / 100) * 180;
  const linePoints = (key) => sCurve.map((d, i) => `${xOf(i)},${yOf(d[key])}`).join(" ");
  const ringPath = "M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831";

  // ===== របារចំហៀងខាងឆ្វេង (Sidebar) =====
  const sidebar = (
    <aside className="w-64 shrink-0 flex flex-col justify-between border-r bg-[#1B2A4E] border-[#152240] dark:bg-[#0A0A0A] dark:border-[#222] text-white">
      <div>
        <div className="p-4 border-b border-white/10">
          <div className="font-bold text-sm uppercase text-blue-300">{t.companyName}</div>
          <div className="text-xs mt-0.5 text-slate-300">{t.projectName}</div>
        </div>

        <div className="p-3 border-b border-white/10">
          <button onClick={() => selectTab("dashboard")}
            className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-bold ${activeTab === "dashboard" ? "bg-blue-600" : "text-slate-300 hover:bg-white/10"}`}>
            <Icon name="LayoutDashboard" size={18} /><span>{t.dashboard}</span>
          </button>
        </div>

        <div className="p-3 space-y-1">
          <div className="px-2 py-1.5 text-[10px] font-bold uppercase text-slate-400">{t.documents}</div>
          {categories.map((cat) => {
            const count = documents.filter((d) => d.category === cat.key).length;
            const active = activeTab === cat.key;
            const locked = !canAccess(cat.key);
            return (
              <button key={cat.key} onClick={() => selectTab(cat.key)}
                className={`w-full flex items-center justify-between px-3 py-2 rounded-md text-xs ${active ? "bg-white/20 font-bold" : locked ? "opacity-50 text-slate-400" : "text-slate-300 hover:bg-white/10"}`}>
                <span className="flex items-center gap-2.5 truncate">
                  <Icon name={cat.icon} className={active ? "text-blue-300" : "text-slate-400"} />
                  <span className="truncate">{isKm ? cat.labelKm : cat.label}</span>
                </span>
                {locked ? <Icon name="Lock" size={12} className="text-amber-400" />
                  : count > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-mono bg-white/10">{count}</span>}
              </button>
            );
          })}
        </div>
      </div>

      {/* ផ្នែកខាងក្រោម: ប៊ូតុង Admin/Login + ព័ត៌មានអ្នកប្រើ */}
      <div className="p-3 border-t border-white/10 space-y-2">
        {isAdmin ? (
          <button onClick={() => setModal("permissions")} className="w-full py-1.5 rounded bg-blue-500/20 text-blue-300 text-[10px] font-bold border border-blue-500/30 flex items-center justify-center gap-1.5">
            <Icon name="ShieldCheck" size={14} /><span>{t.managePermissions}</span>
            {users.some((u) => u.status === "pending") && <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping" />}
          </button>
        ) : session ? (
          <button onClick={() => sb.auth.signOut()} className="w-full py-1.5 rounded bg-rose-500/20 text-rose-300 text-[10px] font-bold border border-rose-500/30">Sign out</button>
        ) : (
          <button onClick={() => setModal("login")} className="w-full py-1.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold border border-emerald-500/30 flex items-center justify-center gap-1.5">
            <Icon name="LogIn" size={14} /><span>{t.loginGoogle}</span>
          </button>
        )}
        <div className="flex items-center gap-2.5 pt-1 border-t border-white/10">
          <img src={currentUser.photo} alt="User" className="w-8 h-8 rounded-full border border-blue-400 object-cover" />
          <div className="flex-1 truncate">
            <div className="text-xs font-bold truncate">{currentUser.name} {currentUser.status === "pending" && <span className="text-[9px] text-amber-400">(Pending)</span>}</div>
            <div className="text-[10px] text-slate-400 truncate">{currentUser.email}</div>
          </div>
        </div>
      </div>
    </aside>
  );

  // ===== ក្បាលទំព័រ (Header): ប៊ូតុងតួនាទី, ភាសា, Night Mode =====
  const header = (
    <header className="px-6 py-3.5 border-b flex items-center justify-between shrink-0 bg-white border-slate-200 dark:bg-[#0A0A0A] dark:border-[#222]">
      <div className="flex items-center gap-4 text-xs font-bold">
        <span>Date: Thursday, Nov 5, 2026</span>
        <span className="text-emerald-600">Active Online: 8</span>
        <span className="text-blue-600">Total Visits: 1,594</span>
      </div>
      <div className="flex items-center gap-3">
        <button onClick={() => !sb && setDemoRole(role === "admin" ? "staff" : role === "staff" ? "viewer" : "admin")}
          className={`px-3 py-1.5 rounded-md text-xs font-bold border ${isAdmin ? "bg-blue-600 border-blue-600 text-white" : "bg-amber-500/10 border-amber-500/30 text-amber-600"}`}>
          {isAdmin ? t.adminRole : role === "staff" ? t.staffRole : t.viewerRole}
        </button>
        {isAdmin && <button onClick={openEditDash} className="px-3 py-1.5 rounded-md text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700">{t.editDashData}</button>}
        <button onClick={() => setLang(isKm ? "en" : "km")} className="px-2.5 py-1.5 rounded-md text-xs font-bold border border-inherit">{isKm ? "EN" : "ខ្មែរ (KM)"}</button>
        <button onClick={() => setTheme(theme === "light" ? "dark" : "light")} className="p-1.5 rounded-md border border-inherit">
          <Icon name={theme === "light" ? "Moon" : "Sun"} />
        </button>
      </div>
    </header>
  );

  // ===== ទំព័រ Dashboard =====
  const dashboard = (
    <>
      {/* ជួរទី ១: វឌ្ឍនភាពសរុប | ចំនួនថ្ងៃ | RFI/RFA/SI/NCR */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
        <Card className="flex items-center justify-between">
          <div>
            <div className="text-xs font-bold uppercase">{t.overallProject}</div>
            <div className="text-3xl font-black mt-1">{completePct}%</div>
            <div className="text-[11px] mt-1">
              <span className="text-emerald-600 font-bold">{t.projectComplete}: {completePct}%</span> | <span className="text-rose-600 font-bold">{t.remaining}: {100 - completePct}%</span>
            </div>
          </div>
          {/* រង្វង់ភាគរយ: ក្រហម = នៅសល់, បៃតង = សម្រេច */}
          <svg className="w-14 h-14 -rotate-90" viewBox="0 0 36 36">
            <path className="text-rose-500" strokeWidth="5" stroke="currentColor" fill="none" d={ringPath} />
            <path className="text-emerald-500" strokeDasharray={`${completePct}, 100`} strokeWidth="5" strokeLinecap="round" stroke="currentColor" fill="none" d={ringPath} />
          </svg>
        </Card>

        <Card className="space-y-2">
          <div className="flex justify-between items-center text-xs font-bold uppercase">
            <span>{t.dayElapsed}</span>
            <span className="text-[10px] text-blue-500 font-mono bg-blue-500/10 px-1.5 py-0.5 rounded">{t.autoCalculated}</span>
          </div>
          <div className="flex justify-between items-baseline">
            <div className="text-2xl font-black">{daysElapsed} / {totalDays} <span className="text-xs font-normal text-slate-500">Days</span></div>
            <span className="text-xs font-bold text-amber-600">{t.remainingDays}: {remainingDays}</span>
          </div>
          <ProgressBar percent={(daysElapsed / totalDays) * 100} />
          <div className="flex justify-between text-[10px] font-mono"><span>Start: {dates.startDate}</span><span>End: {dates.endDate}</span></div>
        </Card>

        <Card className="space-y-2">
          <div className="text-xs font-bold uppercase">{t.rfiRfaSiNcrSummary}</div>
          <div className="grid grid-cols-4 gap-2 text-center font-bold">
            {[
              ["RFI", countType("RFI Folder", "RFI"), "bg-blue-500/10 text-blue-600"],
              ["RFA", countType("RFA Folder", "RFA"), "bg-emerald-500/10 text-emerald-600"],
              ["SI", countType("SI Folder", "SI"), "bg-amber-500/10 text-amber-600"],
              ["NCR", countType("NCR Folder", "NCR"), "bg-rose-500/10 text-rose-600"],
            ].map(([label, count, color]) => (
              <div key={label} className={`p-2 rounded ${color}`}>
                <div className="text-[10px]">{label}</div>
                <div className="text-lg font-black">{count}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* ជួរទី ២: ក្រាប S-Curve | គ្រឿងចក្រ | បុគ្គលិក */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <Card className="lg:col-span-6">
          <CardTitle icon="ChartColumn" right={
            <div className="flex gap-4 text-[11px] font-bold">
              <span className="text-blue-600">● Planned (%)</span><span className="text-rose-700">● Actual (%)</span>
            </div>
          }>{t.sCurveTitle}</CardTitle>
          <div className="h-64 pt-4">
            <svg className="w-full h-full overflow-visible" viewBox="0 0 500 180">
              {/* បន្ទាត់ក្រឡាផ្ដេក */}
              {[0, 45, 90, 135, 180].map((y) => <line key={y} x1="0" y1={y} x2="500" y2={y} stroke="#94A3B8" strokeOpacity="0.3" strokeDasharray="4 4" />)}
              <polyline fill="none" stroke="#2563EB" strokeWidth="3" points={linePoints("planned")} />
              <polyline fill="none" stroke="#B91C1C" strokeWidth="3.5" points={linePoints("actual")} />
              {/* ចំណុច + ស្លាក % លើបន្ទាត់នីមួយៗ */}
              {sCurve.map((d, i) => (
                <g key={d.month}>
                  <circle cx={xOf(i)} cy={yOf(d.planned)} r="4" fill="#2563EB" />
                  <rect x={xOf(i) - 14} y={yOf(d.planned) - 22} width="28" height="13" rx="3" fill="#2563EB" />
                  <text x={xOf(i)} y={yOf(d.planned) - 12} textAnchor="middle" className="text-[9px] font-mono fill-white font-bold">{d.planned}%</text>
                  <circle cx={xOf(i)} cy={yOf(d.actual)} r="5" fill="#B91C1C" />
                  <rect x={xOf(i) - 14} y={yOf(d.actual) + 6} width="28" height="13" rx="3" fill="#B91C1C" />
                  <text x={xOf(i)} y={yOf(d.actual) + 16} textAnchor="middle" className="text-[9px] font-mono fill-white font-bold">{d.actual}%</text>
                </g>
              ))}
            </svg>
            <div className="flex justify-between text-[10px] font-mono mt-2 pt-2 border-t border-inherit">
              {sCurve.map((d) => <span key={d.month}>{d.month}</span>)}
            </div>
          </div>
        </Card>

        {/* បញ្ជីគ្រឿងចក្រ និងបុគ្គលិក (រចនាដូចគ្នា ប្រើ loop ម្តង; ប៊ូតុង Edit សម្រាប់ Admin/Staff ដែលបានអនុញ្ញាត) */}
        {[
          ["machinery", t.machineryTitle, "Truck", "text-amber-600", "bg-amber-500/10 text-amber-600"],
          ["manpower", t.manpowerTitle, "HardHat", "text-blue-600", "bg-blue-500/10 text-blue-600"],
        ].map(([key, title, icon, iconColor, qtyColor]) => (
          <Card key={key} className="lg:col-span-3">
            <CardTitle icon={icon} iconColor={iconColor} right={editBtn(key)}>{title}</CardTitle>
            <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
              {data[key].map((row, i) => (
                <div key={i} className="flex justify-between items-center text-xs p-1.5 rounded bg-slate-50 dark:bg-slate-900 border border-inherit">
                  <span>{row.name}</span>
                  <span className={`font-mono font-bold px-2 py-0.5 rounded ${qtyColor}`}>{row.qty}</span>
                </div>
              ))}
            </div>
          </Card>
        ))}
      </div>

      {/* ជួរទី ៣: Milestones | កម្លាំងប្រចាំសប្តាហ៍ | Drone + អាកាសធាតុ + ផែនទី */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <Card className="lg:col-span-4">
          <CardTitle icon="Clock" right={editBtn("milestones")}>{t.masterScheduleTitle}</CardTitle>
          <div className="space-y-3">
            {data.milestones.map((item, i) => (
              <div key={i} className="p-2.5 rounded-md border border-inherit bg-slate-50/50 dark:bg-slate-900/50 text-xs space-y-1.5">
                <div className="flex justify-between font-bold">
                  <span>{item.title}</span><span className="font-mono text-emerald-600">{item.actual}%</span>
                </div>
                <div className="flex justify-between text-[10px] font-mono">
                  <span>{t.startDate}: <strong>{item.startDate}</strong></span><span>{t.endDate}: <strong>{item.endDate}</strong></span>
                </div>
                <ProgressBar percent={item.actual} color="bg-emerald-500" />
              </div>
            ))}
          </div>
        </Card>

        <Card className="lg:col-span-4">
          <CardTitle icon="Activity" right={editBtn("weekly")}>{t.weeklyPerformance}</CardTitle>
          <div className="space-y-3">
            {data.weekly.map((w, i) => (
              <div key={i} className="p-2.5 rounded-md border border-inherit bg-slate-50/50 dark:bg-slate-900/50 space-y-2">
                <div className="flex justify-between text-xs font-bold"><span>{w.week}</span><span className="text-[10px] font-mono">{w.dateRange}</span></div>
                <div className="space-y-1">
                  <div className="flex justify-between text-[10px] font-bold text-blue-600"><span>Workers</span><span>{w.worker} Persons</span></div>
                  <ProgressBar percent={w.worker} height="h-2" />  {/* ១០០ នាក់ = ពេញរបារ */}
                </div>
                <div className="space-y-1">
                  <div className="flex justify-between text-[10px] font-bold text-amber-600"><span>Machinery</span><span>{w.machinery} Units</span></div>
                  <ProgressBar percent={(w.machinery / 15) * 100} color="bg-amber-500" height="h-2" /> {/* ១៥ គ្រឿង = ពេញរបារ */}
                </div>
              </div>
            ))}
          </div>
        </Card>

        <Card className="lg:col-span-4 space-y-4">
          <DroneGallery images={photos} title={t.droneGalleryTitle} uploadLabel={t.photoBtn}
            onUpload={canEditData ? async (e) => {
              const files = [...e.target.files].slice(0, 10);            // យកអតិបរមា 10 រូប
              if (!files.length) return;
              const cropped = await Promise.all(files.map(async (f) => ({ url: await cropImage(f), caption: f.name.replace(/\.[^.]+$/, "") })));
              setPhotos(cropped);                                        // ជំនួសរូបចាស់ទាំងអស់
              e.target.value = "";
            } : null} />
          {/* អាកាសធាតុពិត: ថ្ងៃនេះ + ម៉ោងបន្ទាប់ + ៥ ថ្ងៃខាងមុខ */}
          <WeatherWidget t={t} isKm={isKm} />
          {/* ផែនទី Google Maps ពីអាសយដ្ឋានគម្រោង */}
          <div>
            <div className="text-[11px] font-bold uppercase mb-1 truncate">{PROJECT_ADDRESS}</div>
            <iframe title="Site map" className="w-full h-44 rounded-md border-0" loading="lazy"
              src={`https://maps.google.com/maps?q=${LOC.lat},${LOC.lon}&t=k&z=16&output=embed`} />
          </div>
        </Card>
      </div>

      {/* ជួរទី ៤: ឯកសារថ្មីៗ ៥ ឯកសារចុងក្រោយ */}
      <Card>
        <CardTitle right={
          <button onClick={() => selectTab("catDrawing")} className="text-xs font-bold text-blue-600 flex items-center gap-1">
            <span>{t.viewAllFiles}</span><Icon name="ChevronRight" size={14} />
          </button>
        }>{t.incomingDocuments}</CardTitle>
        <DocsTable docs={filteredDocs.slice(0, 5)} t={t} isAdmin={isAdmin} onDelete={deleteDocument} onOpen={openDoc} />
      </Card>
    </>
  );

  // ===== ទំព័រប្រភេទឯកសារ (Drawing, Method Statement, ...) =====
  const categoryView = currentCategory && (
    <div className="space-y-6">
      <Card className="space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <h2 className="text-lg font-bold uppercase">{isKm ? currentCategory.labelKm : currentCategory.label}</h2>
          {canEditData && (
            <button onClick={() => setModal("upload")} className="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs flex items-center gap-2">
              <Icon name="Upload" /><span>{t.uploadFile}</span>
            </button>
          )}
        </div>

        {/* ប៊ូតុង Sub-Folder (បង្ហាញជាខ្មែរ តែចម្រោះតាមឈ្មោះអង់គ្លេស) */}
        {currentCategory.subFolders.length > 0 && (
          <div className="flex items-center gap-2 overflow-x-auto pb-1 pt-2 border-t border-inherit">
            <span className="text-xs font-bold text-slate-500 mr-2">{t.subCategoryHeading}:</span>
            {currentCategory.subFolders.map((sub, i) => (
              <button key={sub} onClick={() => setActiveSub(sub)}
                className={`px-3 py-1.5 rounded-md text-xs font-bold whitespace-nowrap ${activeSub === sub ? "bg-blue-600 text-white" : "bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"}`}>
                {isKm ? currentCategory.subFoldersKm[i] : sub}
              </button>
            ))}
          </div>
        )}

        {/* ស្វែងរក + តម្រង Format + តម្រង Status + តម្រៀប */}
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 pt-3 border-t border-inherit">
          <div className="relative">
            <Icon name="Search" className="absolute left-3 top-2.5 text-slate-400" />
            <input type="text" placeholder={t.searchPlaceholder} value={filters.search}
              onChange={(e) => setFilters({ ...filters, search: e.target.value })} className={`${INPUT} pl-9`} />
          </div>
          <select value={filters.format} onChange={(e) => setFilters({ ...filters, format: e.target.value })} className={INPUT}>
            <option value="ALL">{t.formatFilter}</option>
            {FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}
          </select>
          <select value={filters.status} onChange={(e) => setFilters({ ...filters, status: e.target.value })} className={INPUT}>
            <option value="ALL">{t.statusFilter}</option>
            {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={filters.sort} onChange={(e) => setFilters({ ...filters, sort: e.target.value })} className={`${INPUT} font-mono`}>
            <option value="DATE_DESC">{t.sortDateDesc}</option>
            <option value="DATE_ASC">{t.sortDateAsc}</option>
            <option value="NAME_ASC">{t.sortNameAsc}</option>
            <option value="NAME_DESC">{t.sortNameDesc}</option>
          </select>
        </div>
      </Card>

      <Card><DocsTable docs={filteredDocs} t={t} isAdmin={isAdmin} onDelete={deleteDocument} onOpen={openDoc} /></Card>
    </div>
  );

  // ===== Popup ទាំង ៤ (បង្ហាញតែមួយក្នុងពេលតែមួយ តាមតម្លៃ modal) =====

  // ១) ចុះឈ្មោះតាម Google
  const loginModal = modal === "login" && (
    <Modal title={t.googleAuthNotice} onClose={() => setModal(null)}>
      <p className="py-4 text-center text-slate-600 dark:text-slate-300">Register or log in using your corporate Google Account to request staff access from the Project Admin.</p>
      <button onClick={simulateGoogleLogin} className="w-full py-2.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center gap-2">
        <Icon name="UserPlus" /><span>{sb ? "Continue with Google" : "Continue with Google (Simulate)"}</span>
      </button>
    </Modal>
  );

  // ២) Admin អនុម័តអ្នកប្រើ និងកំណត់សិទ្ធិតាមផ្នែក
  const permissionsModal = modal === "permissions" && isAdmin && (
    <Modal title={t.managePermissions} onClose={() => setModal(null)} width="max-w-lg">
      <div className="space-y-2">
        <div className="font-bold uppercase text-slate-500">Registered Users Approval Queue</div>
        {users.map((u) => (
          <div key={u.id} className="flex items-center justify-between p-2.5 rounded border border-inherit">
            <div className="flex items-center gap-2">
              <img src={u.photo} alt={u.name} className="w-7 h-7 rounded-full object-cover" />
              <div><div className="font-bold">{u.name}</div><div className="text-[10px] text-slate-500">{u.email}</div></div>
            </div>
            {u.status === "pending" ? (
              <button onClick={() => approveUser(u.id)} className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold text-[10px] flex items-center gap-1"><Icon name="Check" size={12} /> Approve</button>
            ) : <span className="text-[10px] font-bold text-emerald-500">Approved</span>}
          </div>
        ))}
      </div>
      <div className="space-y-2 pt-2 border-t border-inherit">
        <div className="font-bold uppercase text-slate-500">Staff Section Access Checklist</div>
        {categories.map((cat) => (
          <label key={cat.key} className="flex items-center justify-between p-2 rounded border border-inherit cursor-pointer">
            <span className="font-bold">{isKm ? cat.labelKm : cat.label}</span>
            <input type="checkbox" checked={permissions[cat.key] || false} className="w-4 h-4"
              onChange={(e) => setPermissions({ ...permissions, [cat.key]: e.target.checked })} />
          </label>
        ))}
      </div>
      <label className="flex items-center justify-between p-2 rounded border border-blue-500/40 cursor-pointer">
        <span className="font-bold">{t.allowEdit}</span>
        <input type="checkbox" checked={permissions.canEdit || false} className="w-4 h-4" onChange={(e) => setPermissions({ ...permissions, canEdit: e.target.checked })} />
      </label>
      <div className="flex justify-end"><button onClick={() => setModal(null)} className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{t.saveChanges}</button></div>
    </Modal>
  );

  // ៣) បញ្ចូលឯកសារថ្មី
  const subFolderOptions = (categories.find((c) => c.key === newDoc.category) || { subFolders: [], subFoldersKm: [] });
  const uploadModal = modal === "upload" && canEditData && (
    <Modal title={t.uploadFile} onClose={() => setModal(null)}>
      <form onSubmit={uploadDocument} className="space-y-3">
        <Field label={t.browse}>
          <input type="file" required className={INPUT}
            onChange={(e) => {
              const f = e.target.files[0]; if (!f) return;
              setNewFile(f);
              setNewDoc({ ...newDoc, name: newDoc.name || f.name.replace(/\.[^.]+$/, ""), format: guessFormat(f.name) }); // ទាយឈ្មោះ និង Format
            }} />
        </Field>
        <Field label="Document Title">
          <input type="text" required value={newDoc.name} className={INPUT} placeholder="e.g. Method Statement for Abutment Concrete"
            onChange={(e) => setNewDoc({ ...newDoc, name: e.target.value })} />
        </Field>
        <Field label="Category">
          <select value={newDoc.category} className={INPUT}
            onChange={(e) => {
              const cat = categories.find((c) => c.key === e.target.value);
              setNewDoc({ ...newDoc, category: e.target.value, subFolder: cat.subFolders[0] || "" }); // ប្តូរប្រភេទ → ជ្រើស Sub-Folder ដំបូងឲ្យ
            }}>
            {categories.map((c) => <option key={c.key} value={c.key}>{isKm ? c.labelKm : c.label}</option>)}
          </select>
        </Field>
        {subFolderOptions.subFolders.length > 0 && (
          <Field label="Sub-Folder">
            <select value={newDoc.subFolder} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, subFolder: e.target.value })}>
              {subFolderOptions.subFolders.map((sub, i) => <option key={sub} value={sub}>{isKm ? subFolderOptions.subFoldersKm[i] : sub}</option>)}
            </select>
          </Field>
        )}
        <div className="grid grid-cols-2 gap-2">
          <Field label="Format">
            <select value={newDoc.format} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, format: e.target.value })}>
              {FORMATS.map((f) => <option key={f}>{f}</option>)}
            </select>
          </Field>
          <Field label="Status">
            <select value={newDoc.status} className={INPUT} onChange={(e) => setNewDoc({ ...newDoc, status: e.target.value })}>
              {STATUSES.map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <button type="button" onClick={() => setModal(null)} className="px-3 py-1.5 rounded border border-inherit">{t.cancel}</button>
          <button type="submit" className="px-4 py-1.5 rounded bg-blue-600 text-white font-bold">{t.submit}</button>
        </div>
      </form>
    </Modal>
  );

// ៤) កែប្រែទិន្នន័យ Dashboard (% សម្រេច, ថ្ងៃចាប់ផ្តើម/បញ្ចប់, S-Curve Actual)
// ៤) កែប្រែទិន្នន័យ Dashboard (% សម្រេច, ថ្ងៃចាប់ផ្តើម/បញ្ចប់, S-Curve Actual)
  const editDashModal = modal === "editDash" && isAdmin && editForm && (
    <Modal title={t.editDashData} onClose={() => setModal(null)} width="max-w-xl">
      <form onSubmit={saveEditDash} className="space-y-4">
        <div className="grid grid-cols-3 gap-3">
          <Field label="Completion (%)">
            <input type="number" value={editForm.pct} className={INPUT} onChange={(e) => setEditForm({ ...editForm, pct: Number(e.target.value) })} />
          </Field>
          <Field label="Project Start Date">
            <input type="date" value={editForm.dates.startDate} className={INPUT} onChange={(e) => setEditForm({ ...editForm, dates: { ...editForm.dates, startDate: e.target.value } })} />
          </Field>
          <Field label="Project End Date">
            <input type="date" value={editForm.dates.endDate} className={INPUT} onChange={(e) => setEditForm({ ...editForm, dates: { ...editForm.dates, endDate: e.target.value } })} />
          </Field>
        </div>

        <div className="flex items-center justify-between pt-2 border-t border-inherit">
          <div className="font-bold uppercase text-blue-600">S-Curve Monthly Progress Data</div>
          {/* ប៊ូតុងបន្ថែមខែថ្មី */}
          <button 
            type="button" 
            onClick={() => {
              const lastItem = editForm.sCurve[editForm.sCurve.length - 1];
              const newMonthName = prompt("បញ្ចូលឈ្មោះខែថ្មី (ឧទាហរណ៍: Jan-27):", "Jan-27");
              if (!newMonthName) return;
              setEditForm({
                ...editForm,
                sCurve: [
                  ...editForm.sCurve,
                  { month: newMonthName, planned: lastItem ? lastItem.planned : 100, actual: lastItem ? lastItem.actual : 0 }
                ]
              });
            }} 
            className="px-2.5 py-1 rounded bg-emerald-600 text-white font-bold text-xs"
          >
            + បន្ថែមខែ (Add Month)
          </button>
        </div>

        <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
          {editForm.sCurve.map((item, i) => (
            <div key={i} className="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 p-2 rounded border border-inherit">
              <input 
                type="text" 
                value={item.month} 
                className={`${INPUT} w-24 font-bold`} 
                onChange={(e) => setEditForm({
                  ...editForm,
                  sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, month: e.target.value } : d))
                })} 
              />
              <div className="flex items-center gap-1 flex-1">
                <span className="text-[10px] text-blue-600 font-bold">Plan%:</span>
                <input 
                  type="number" 
                  value={item.planned} 
                  className={INPUT} 
                  onChange={(e) => setEditForm({
                    ...editForm,
                    sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, planned: Number(e.target.value) } : d))
                  })} 
                />
              </div>
              <div className="flex items-center gap-1 flex-1">
                <span className="text-[10px] text-rose-600 font-bold">Actual%:</span>
                <input 
                  type="number" 
                  value={item.actual} 
                  className={INPUT} 
                  onChange={(e) => setEditForm({
                    ...editForm,
                    sCurve: editForm.sCurve.map((d, j) => (j === i ? { ...d, actual: Number(e.target.value) } : d))
                  })} 
                />
              </div>
              {/* ប៊ូតុងលុបខែ */}
              <button 
                type="button" 
                onClick={() => setEditForm({
                  ...editForm,
                  sCurve: editForm.sCurve.filter((_, j) => j !== i)
                })} 
                className="p-1 text-slate-400 hover:text-rose-600"
              >
                <Icon name="Trash2" size={14} />
              </button>
            </div>
          ))}
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-inherit">
          <button type="button" onClick={() => setModal(null)} className="px-3 py-1.5 rounded-md border border-inherit">{t.cancel}</button>
          <button type="submit" className="px-4 py-1.5 rounded-md font-bold bg-blue-600 hover:bg-blue-700 text-white">{t.saveChanges}</button>
        </div>
      </form>
    </Modal>
  );

  // ៥) កែតារាង (Machinery, Manpower, Milestones, Weekly)
  const editListModal = editing && canEditData && (
    <EditListModal cfg={EDIT_CONFIG[editing]} title={`${t.edit}: ${t[EDIT_CONFIG[editing].titleKey]}`} rows={data[editing]} t={t}
      onClose={() => setEditing(null)}
      onSave={(rows) => { setData({ ...data, [editing]: rows }); setEditing(null); }} />
  );

  /* ---------- ង. ផ្គុំគ្រប់ផ្នែកជាទំព័រពេញ ---------- */
  return (
    <div className={`min-h-screen flex text-sm bg-[#F4F7FC] text-[#111827] dark:bg-black dark:text-white ${isKm ? "font-khmer text-[15px] leading-relaxed" : "font-serif"}`}>
      {sidebar}
      <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
        {header}
        {sb && profile?.role === "pending" && (
          <div className="bg-amber-500 text-white px-6 py-2.5 text-xs font-bold">
            ⏳ {isKm ? "គណនីរបស់អ្នកកំពុងរង់ចាំការអនុម័តពី Admin។ អ្នកមើលបានតែ Dashboard រហូតដល់ត្រូវបានអនុម័ត។"
                     : "Your account is waiting for Admin approval. You can view the Dashboard only until approved."}
          </div>
        )}
        {accessDenied && (
          <div className="bg-rose-600 text-white px-6 py-2.5 text-xs font-bold flex items-center justify-between">
            <span className="flex items-center gap-2"><Icon name="Lock" /> {t.accessDenied}</span>
            <button onClick={() => setAccessDenied(false)}><Icon name="X" /></button>
          </div>
        )}
        <div className="p-6 space-y-6 flex-1">{activeTab === "dashboard" ? dashboard : categoryView}</div>
        <footer className="px-6 py-4 text-center text-[11px] border-t border-slate-200 dark:border-[#222] text-slate-500 dark:text-slate-400">
          © 11/2026 LEVI JIN. All rights reserved. Reproduction or redistribution is strictly prohibited.
        </footer>
      </main>
      {loginModal}
      {permissionsModal}
      {uploadModal}
      {editDashModal}
      {editListModal}
    </div>
  );
}

// ចាប់ផ្តើមបង្ហាញ App ក្នុង <div id="root">
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
